services:
  nasa-stub:
    build:
      context: .
      dockerfile: tests/Dockerfile.stub

  server:
    build: ./server
    command: npm start
    environment:
      PORT: "3000"
      API_TOKEN: pytest-token
      NASA_API_URL: http://nasa-stub:8000/apod
    depends_on:
      - nasa-stub

  app:
    build: ./app
    depends_on:
      - server

  e2e:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      APP_URL: http://app
      RUN_E2E_TESTS: "1"
    depends_on:
      - app
      - server
