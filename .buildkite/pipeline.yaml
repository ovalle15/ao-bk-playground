
steps:
  - key: "docker"
    label: ":docker: Build & Push app/server"
    agents:
      queue: "kube"
    command: |
      set -euo pipefail

      echo "Logging into bk package registry using OIDC"
      buildkite-agent oidc request-token --audience "https://packages.buildkite.com/spacecamp/nasa-image" --lifetime 300 | docker login packages.buildkite.com/spacecamp/nasa-image --username buildkite --password-stdin

      # Build amd64 and arm64 so the images run on both cloud hosts and Apple-silicon clusters
      echo "Building and pushing multi-arch Docker images to Buildkite Package Registry"
      docker buildx build --platform linux/amd64,linux/arm64 --tag packages.buildkite.com/spacecamp/nasa-image/app:latest --push ./app
      docker buildx build --platform linux/amd64,linux/arm64 --tag packages.buildkite.com/spacecamp/nasa-image/server:latest --push ./server