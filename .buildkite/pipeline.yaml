
steps:
  - key: "docker"
    label: ":docker: Build & Push app/server"
    agents:
      queue: "macos-med"
    command: |
      set -euo pipefail
      umask 077
      

      echo "Building Docker images"
      docker build --tag packages.buildkite.com/spacecamp/nasa-image/app:latest ./app
      docker build --tag packages.buildkite.com/spacecamp/nasa-image/server:latest ./server

      echo "Logging into bk package registry using OIDC"
      buildkite-agent oidc request-token --audience "https://packages.buildkite.com/spacecamp/nasa-image" --lifetime 300 | docker login packages.buildkite.com/spacecamp/nasa-image --username buildkite --password-stdin

      echo "Pushing Docker images to Buildkite Package Registry"
      docker push packages.buildkite.com/spacecamp/nasa-image/app:latest
      docker push packages.buildkite.com/spacecamp/nasa-image/server:latest
      
      