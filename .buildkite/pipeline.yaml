steps:
  - key: "docker"
    label: ":docker: Build & Push app/server"
    agents:
      queue: "webhook-acquire"
    command: |
      set -euo pipefail
      DOCKER_CONFIG="$(mktemp -d "$${TMPDIR:-/tmp}/buildkite-docker.XXXXXX")"
      export DOCKER_CONFIG
      trap 'rm -rf "$$DOCKER_CONFIG"' EXIT

      echo "Building Docker images"
      docker build --tag packages.buildkite.com/spacecamp/ao-bk-playground/app:latest ./app
      docker build --tag packages.buildkite.com/spacecamp/ao-bk-playground/server:latest ./server

      echo "Preparing temporary Buildkite Package Registry credentials"
      buildkite-agent oidc request-token --audience "https://packages.buildkite.com/spacecamp/ao-bk-playground" --lifetime 300 |
        python3 scripts/write-docker-auth.py packages.buildkite.com

      echo "Pushing Docker images to Buildkite Package Registry"
      docker push packages.buildkite.com/spacecamp/ao-bk-playground/app:latest
      docker push packages.buildkite.com/spacecamp/ao-bk-playground/server:latest