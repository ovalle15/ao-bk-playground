env:
  # the self-hosted agent uploads and downloads archives through this S3 prefix.
  BUILDKITE_AGENT_CACHE_STORE_URL: "s3://s3-cache-andrea/buildkite?region=us-east-1"

steps:
  - label: ":test_tube: E2E tests with cached Python wheels"
    key: "e2e-cache"
    agents:
      queue: "cache"
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    # Credentials from this plugin are available to the cache commands below.
    plugins:
      - aws-assume-role-with-web-identity#v1.2.0:
          role-arn: arn:aws:iam::097340723131:role/ao-cache-demo
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
    # The runner handles restore, wheel download, save, and the E2E suite.
    command: "python3 scripts/run-cached-e2e.py"
    