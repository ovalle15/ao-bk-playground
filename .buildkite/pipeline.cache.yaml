env:
  # the self-hosted agent uploads and downloads archives through this S3 prefix.
  BUILDKITE_AGENT_CACHE_STORE_URL: "s3://s3-cache-andrea/buildkite?region=us-east-1"

steps:
  - key: "e2e-cache"
    label: ":test_tube: E2E tests with cached Python wheels"
    agents:
      queue: "cache"
    # The runner handles restore, wheel download, save, and the E2E suite.
    command: "python3 scripts/run-cached-e2e.py"