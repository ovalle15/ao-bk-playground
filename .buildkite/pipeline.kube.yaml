env:
  APP_URL: "http://nasa-image-app.nasa-image.svc.cluster.local"
  API_URL: "http://nasa-image-server.nasa-image.svc.cluster.local:3000"
  HELM_RELEASE: "nasa-image"
  KUBE_NAMESPACE: "nasa-image"
  # Set this if the Buildkite Packages registry requires authenticated pulls.
  REGISTRY_PULL_SECRET_NAME: ""
  APP_VERSION: "1.4"
  QUEUE: "kube"

steps:
  - label: ":helm: Validate chart"
    key: "validate-chart"
    agents:
      queue: "${QUEUE}"
    image: "alpine/helm:latest"
    command: |
      set -eu
      helm lint ./helm --strict
      helm template "$$HELM_RELEASE" ./helm \
        --namespace "$$KUBE_NAMESPACE" \
        --set-string "secrets.apiToken=validation-placeholder" \
        > /dev/null

  - label: ":rocket: Deploy published images through :helm:"
    key: "deploy-published-images"
    depends_on: "validate-chart"
    agents:
      queue: "${QUEUE}"
    image: "alpine/helm:latest"
    secrets:
      API_TOKEN: NASA_API_TOKEN
    concurrency: 1
    concurrency_group: "nasa-image-test"
    command: |
      set -eu
      set --
      if [ -n "$$REGISTRY_PULL_SECRET_NAME" ]; then
        set -- --set-string "imagePullSecrets[0].name=$$REGISTRY_PULL_SECRET_NAME"
      fi

      helm upgrade --install "$$HELM_RELEASE" ./helm \
        --namespace "$$KUBE_NAMESPACE" \
        --rollback-on-failure \
        --wait \
        --timeout 5m \
        --set-string "secrets.apiToken=$$API_TOKEN" \
        "$$@"
  - trigger : "ao-tests"
    label: ":test_tube: Testing application..."
    depends_on: "deploy-published-images"
    build:
      message: "Triggering ao-tests pipeline"
      env: 
        QUEUE: "kube"