env:
  APP_URL: "http://nasa-image-app.nasa-image.svc.cluster.local"
  API_URL: "http://nasa-image-server.nasa-image.svc.cluster.local:3000"
  HELM_RELEASE: "nasa-image"
  KUBE_NAMESPACE: "nasa-image"
  NASA_API_SECRET: "nasa-api-token"
  # Set this if the Buildkite Packages registry requires authenticated pulls.
  REGISTRY_PULL_SECRET: ""
  APP_VERSION: "1.0"
  QUEUE: "kube"

steps:
  - label: ":helm: Validate chart"
    key: "validate-chart"
    agents:
      queue: "$$QUEUE"
    image: "alpine/helm:latest"
    command: |
      set -eu
      helm lint ./helm --strict
      helm template "$$HELM_RELEASE" ./helm \
        --namespace "$$KUBE_NAMESPACE" \
        --set-string "secrets.existingSecret=$$NASA_API_SECRET" \
        > /dev/null

  - label: ":kube: Deploy published images"
    key: "deploy-published-images"
    depends_on: "validate-chart"
    agents:
      queue: "$$QUEUE"
    image: "alpine/helm:latest"
    concurrency: 1
    concurrency_group: "nasa-image-test"
    command: |
      set -eu
      set --
      if [ -n "$$REGISTRY_PULL_SECRET" ]; then
        set -- --set-string "imagePullSecrets[0].name=$$REGISTRY_PULL_SECRET"
      fi

      helm upgrade --install "$$HELM_RELEASE" ./helm \
        --namespace "$$KUBE_NAMESPACE" \
        --rollback-on-failure \
        --wait \
        --timeout 5m \
        --set-string "secrets.existingSecret=$$NASA_API_SECRET" \
        "$$@"

